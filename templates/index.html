<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><link rel="manifest" href="/static/manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"><title>Signal Forge</title></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><header><div><span class="eyebrow">QUANT SIGNAL ENGINE</span><h1>Signal Forge</h1></div><div class="head-actions"><button id="sound" class="icon">🔊</button><button id="theme" class="icon">◐</button></div></header><main><nav class="tabs"><button class="tab active" data-tab="signal">Signal</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="settings">Settings</button></nav><section id="signal" class="page active"><div class="toolbar glass"><div><b id="pair">BTC/USDT</b><span id="market">BINANCE · 15m</span></div><button id="analyze" class="primary">SCAN NOW</button></div><div id="alertBox" class="alertbox">🚨 TÍN HIỆU CỰC MẠNH!</div><div id="signalCard" class="signal-card waiting"><div id="signalIcon">⏸️</div><div id="signalText">ĐANG CHỜ</div><div id="signalMeta">Cần đủ 6 tầng xác nhận độc lập</div></div><div class="stats"><div class="stat glass"><span>Price</span><b id="price">—</b></div><div class="stat glass"><span>Composite</span><b id="confidence">—</b></div><div class="stat glass"><span>WF accuracy</span><b id="wf">—</b></div></div><h2>6-Layer Gate</h2><div id="layers" class="layer-grid"></div><div class="indicator glass"><h3>Market diagnostics</h3><div id="indicators" class="diag"></div></div></section><section id="history" class="page"><div class="toolbar glass"><div><b>Alert history</b><span>tối đa 200 tín hiệu</span></div><button id="clear" class="danger">CLEAR</button></div><div id="historyList" class="history-list"></div></section><section id="settings" class="page"><div class="settings glass"><h2>Engine settings</h2><label>Sàn<select id="exchange"></select></label><label>Symbol<input id="symbol" value="BTC/USDT"></label><label>Timeframe<select id="timeframe"><option>5m</option><option selected>15m</option><option>30m</option><option>1h</option><option>4h</option></select></label><label>HTF<select id="htf"><option selected>1h</option><option>4h</option><option>1d</option></select></label><label>Candle limit<input id="limit" type="number" value="1200" min="300" max="1500"></label><label>Scanner interval (giây)<input id="interval" type="number" value="300" min="30"></label><label>Watchlist <small>mỗi dòng một symbol</small><textarea id="watchlist">ETH/USDT
SOL/USDT</textarea></label><label>Telegram bot token<input id="token" type="password" autocomplete="off"></label><label>Telegram chat ID<input id="chat" autocomplete="off"></label><div class="row"><button id="save" class="primary">SAVE CONFIG</button><button id="train" class="secondary">TRAIN MODEL</button></div><div id="modelInfo" class="model-info"></div><div class="scanner"><b>Background scanner</b><button id="scannerBtn" class="secondary">START</button><span id="scannerStatus">Stopped</span></div></div></section></main><div id="toast"></div><script src="/static/app.js"></script></body></html>
